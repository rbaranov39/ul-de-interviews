services:
  postgres:
    image: postgres:17
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/ddl/source_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/seed/synthetic.sql:/docker-entrypoint-initdb.d/02_synthetic.sql:ro
      - ./sql/ddl/dwh_schema.sql:/docker-entrypoint-initdb.d/03_dwh_schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.17.56
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT}:8123"
      - "127.0.0.1:${CLICKHOUSE_TCP_PORT}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./sql/ddl/clickhouse_mart.sql:/docker-entrypoint-initdb.d/01_mart.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'clickhouse-client --user "$${CLICKHOUSE_USER}" --password "$${CLICKHOUSE_PASSWORD}" --query "SELECT 1" >/dev/null'
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  airflow-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 10s
      timeout: 10s
      retries: 10

  airflow-init:
    build: ./infra/airflow
    image: de-interviews-v3-airflow:3.3.0
    command: db migrate
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/${AIRFLOW_DB_NAME}"
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    depends_on:
      airflow-postgres:
        condition: service_healthy
    restart: "no"

  airflow-api-server:
    build: ./infra/airflow
    image: de-interviews-v3-airflow:3.3.0
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        printf '{"%s":"%s"}\n' "$$AIRFLOW_UI_USER" "$$AIRFLOW_UI_PASSWORD" > /opt/airflow/simple_auth_manager_passwords.json.generated
        exec airflow api-server
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/${AIRFLOW_DB_NAME}"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW_UI_USER: ${AIRFLOW_UI_USER}
      AIRFLOW_UI_PASSWORD: ${AIRFLOW_UI_PASSWORD}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_UI_USER}:admin"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    build: ./infra/airflow
    image: de-interviews-v3-airflow:3.3.0
    command: scheduler
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/${AIRFLOW_DB_NAME}"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      ETL_DB_HOST: postgres
      ETL_DB_PORT: 5432
      ETL_DB_NAME: ${POSTGRES_DB}
      ETL_DB_USER: ${POSTGRES_USER}
      ETL_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./etl:/opt/airflow/etl:ro
      - ./ml:/opt/airflow/ml:ro
      - ./sql:/opt/airflow/sql:ro
      - ./artifacts:/opt/airflow/artifacts
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_started
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  airflow-dag-processor:
    build: ./infra/airflow
    image: de-interviews-v3-airflow:3.3.0
    command: dag-processor
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/${AIRFLOW_DB_NAME}"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./etl:/opt/airflow/etl:ro
      - ./ml:/opt/airflow/ml:ro
      - ./sql:/opt/airflow/sql:ro
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  superset-init:
    build: infra/superset
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        superset db upgrade
        superset fab create-admin \
          --username "$${SUPERSET_ADMIN_USER}" \
          --firstname User \
          --lastname User \
          --email user@example.com \
          --password "$${SUPERSET_ADMIN_PASSWORD}" \
          || superset fab list-users | grep -q "$${SUPERSET_ADMIN_USER}"
        superset init
        superset set-database-uri \
          --database_name "ClickHouse Analytics" \
          --uri "clickhousedb://$${CLICKHOUSE_USER}:$${CLICKHOUSE_PASSWORD}@clickhouse:8123/$${CLICKHOUSE_DB}"
        python /app/prepare_assets.py
        superset import-dashboards \
          --path /app/assets/market_rate_corridor.zip \
          --username "$${SUPERSET_ADMIN_USER}"
    environment:
      SUPERSET_DB_URI: "postgresql+psycopg2://${SUPERSET_DB_USER}:${SUPERSET_DB_PASSWORD}@superset-postgres:5432/${SUPERSET_DB_NAME}"
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ./superset_config.py:/app/superset_config.py:ro
      - ./infra/superset/assets:/app/assets:ro
    depends_on:
      superset-postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: "no"

  superset:
    build: ./infra/superset
    environment:
      SUPERSET_DB_URI: "postgresql+psycopg2://${SUPERSET_DB_USER}:${SUPERSET_DB_PASSWORD}@superset-postgres:5432/${SUPERSET_DB_NAME}"
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_CONFIG_PATH: /app/superset_config.py
    volumes:
      - ./superset_config.py:/app/superset_config.py:ro
    ports:
      - "127.0.0.1:${SUPERSET_PORT}:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully

  superset-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${SUPERSET_DB_USER}
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD}
      POSTGRES_DB: ${SUPERSET_DB_NAME}
    volumes:
      - superset_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
  clickhouse_data:
  airflow_postgres_data:
  superset_postgres_data:
